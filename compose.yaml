services:
  app:
    build: .docker/php
    volumes:
      - .:/app
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ddd_example
      DB_USERNAME: ddd_user
      DB_PASSWORD: local-only-password
    depends_on:
      mysql:
        condition: service_healthy
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-0}:80"
    volumes:
      - ./public:/app/public:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-only-root-password
      MYSQL_DATABASE: ddd_example
      MYSQL_USER: ddd_user
      MYSQL_PASSWORD: local-only-password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./.docker/mysql/init-testing.sql:/docker-entrypoint-initdb.d/init-testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
